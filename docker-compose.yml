services:
  # 1. カスタム Exporter サービス
  exporter:
    build:
      context: ./exporter
    container_name: extreme_ap_exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      # targets.csv の変更をコンテナに即時反映
      - ./exporter/targets.csv:/app/targets.csv
    # 自己署名証明書を使用するAPIと通信するため、
    # requests (urllib3) の警告を無効化
    # (exporter.py内で対応済みだが、念のため環境変数も設定)
    environment:
      - PYTHONWARNINGS="ignore:Unverified HTTPS request"

  # 2. Prometheus サービス
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle' # API経由でリロード可能にする

  flask-proxy:
    build: ./proxy
    container_name: flask-auth-proxy
    ports:
      - "8080:8080"   # Webアクセス先 → http://localhost:3000
    environment:
      - SECRET_KEY=supersecretkey
      - GRAFANA_URL=http://grafana:3000
      - PROXY_HEADER=X-WEBAUTH-USER
    depends_on:
      - grafana

  # 3. Grafana サービス
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    restart: always
    # ports:
      # - "3000:3000"  # Avoid direct access to Grafana
    volumes:
      # データソースとダッシュボードのプロビジョニング
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      # カスタムロゴ
      - ./custom/logo.svg:/usr/share/grafana/public/img/grafana_icon.svg
      - ./custom/logo.svg:/usr/share/grafana/public/img/grafana_logo.svg
      - ./custom/logo.svg:/usr/share/grafana/public/img/grafana_typelogo.svg
    environment:
      # デフォルトの管理者パスワードを変更
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana # 起動後に変更してください
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true

volumes:
  prometheus_data: {}
  grafana_data: {}