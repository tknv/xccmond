services:
  # 1. カスタム Exporter サービス
  exporter:
    build:
      context: ./exporter
    container_name: extreme_ap_exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      # targets.csv の変更をコンテナに即時反映
      - ./exporter/targets.csv:/app/targets.csv
    # 自己署名証明書を使用するAPIと通信するため、
    # requests (urllib3) の警告を無効化
    # (exporter.py内で対応済みだが、念のため環境変数も設定)
    environment:
      - PYTHONWARNINGS="ignore:Unverified HTTPS request"
    # Exporterにもメモリ制限
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '1'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Prometheus サービス
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      # for large scale deployments
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=10GB'
      - '--storage.tsdb.min-block-duration=2h'
      - '--storage.tsdb.max-block-chunk-segment-size=512MB'
      - '--query.max-samples=100000000'
      - '--query.timeout=5m'
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: '4'
        reservations:
          memory: 8G
          cpus: '2'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  flask-proxy:
    build: ./proxy
    container_name: flask-auth-proxy
    ports:
      - "8080:8080"   # Webアクセス先 → http://localhost:3000
    environment:
      - SECRET_KEY=supersecretkey
      - GRAFANA_URL=http://grafana:3000
      - PROXY_HEADER=X-WEBAUTH-USER
    depends_on:
      - grafana
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # 3. Grafana サービス
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"  # Avoid direct access to Grafana
    volumes:
      # データソースとダッシュボードのプロビジョニング
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      # カスタムロゴ
      - ./custom/logo.svg:/usr/share/grafana/public/img/grafana_icon.svg
      - ./custom/logo.svg:/usr/share/grafana/public/img/grafana_logo.svg
      - ./custom/logo.svg:/usr/share/grafana/public/img/grafana_typelogo.svg
      # favicon
      - ./custom/favicon.ico:/usr/share/grafana/public/img/fav32.ico
      # カスタムcss
      - ./custom/custom.css:/usr/share/grafana/public/css/custom.css
    environment:
      # デフォルトの管理者パスワードを変更
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana # 起動後に変更してください
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_NEWS_NEWS_FEED_ENABLED=false
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G

volumes:
  prometheus_data: {}
  grafana_data: {}
