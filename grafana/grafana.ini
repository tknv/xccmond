[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
auto_sign_up = true
# 新しいユーザーを作成したときのデフォルトロールを「Viewer」に
default_role = Viewer
;header_property = username
;whitelist = 127.0.0.1
enable_login_token = false
trusted_ips = 127.0.0.1,10.0.0.0/8

[news]
# Disable Blog news feed
news_feed_enabled = false

[server]
# カスタムCSSを有効化
enable_custom_css = true

[custom]
# カスタムCSSファイルのパス
css_path = /usr/share/grafana/public/css/custom.css

[explore]
# Exploreを無効化（検索結果に表示させない場合）
enabled = false

[analytics]
# 使用統計を無効化
reporting_enabled = false
check_for_updates = false
