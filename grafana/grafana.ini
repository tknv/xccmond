[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
# 新しいユーザーを作成したときのデフォルトロールを「Viewer」に
default_role = Viewer
sync_ttl = 60
whitelist = 
headers =
enable_login_token = false
trusted_ips = 127.0.0.1,10.0.0.0/8,192.168.100.0/24

[security]
# プロキシ経由のアクセスを許可するため、ホストチェックを緩和
allow_embedding = true
cookie_secure = false
cookie_samesite = lax

[remote_cache]
# WebSocketの問題を回避
type = database

[live]
# WebSocketを無効化（プロキシ経由では不要な機能）
max_connections = 0

[news]
# Disable Blog news feed
news_feed_enabled = false

[server]
# カスタムCSSを有効化
enable_custom_css = true
# プロキシ経由でのアクセスを許可
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

# プロキシからのホスト情報を信頼
enable_gzip = true

[custom]
# カスタムCSSファイルのパス
css_path = /usr/share/grafana/public/css/custom.css

[explore]
# Exploreを無効化（検索結果に表示させない場合）
enabled = false

[analytics]
# 使用統計を無効化
reporting_enabled = false
check_for_updates = false
