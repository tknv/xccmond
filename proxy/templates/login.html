<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>XIQ-C Dashboard Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .left-panel {
      flex: 1;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 80px;
      position: relative;
    }

    .logo-text {
      margin-bottom: 80px;
    }

    .logo-text h1 {
      font-size: 48px;
      font-weight: 300;
      color: #333;
      line-height: 1.2;
    }

    .logo-text .extreme {
      color: #5b4e9f;
      font-weight: 600;
    }

    .logo-text .cloud {
      font-weight: 300;
    }

    .logo-text .iq {
      font-weight: 300;
    }

    .logo-text .controller {
      font-weight: 700;
      color: #000;
    }

    .login-form {
      max-width: 400px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .form-group label .required {
      color: #e67e22;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      border-color: #5b4e9f;
    }

    .login-button {
      width: 100%;
      padding: 14px;
      background: #e8e8f0;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      color: #999;
      cursor: not-allowed;
      transition: all 0.3s;
    }

    .login-button:hover:not(:disabled) {
      background: #5b4e9f;
      color: white;
      cursor: pointer;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .footer {
      position: absolute;
      bottom: 30px;
      left: 80px;
      font-size: 12px;
      color: #999;
    }

    .right-panel {
      flex: 1;
      background: linear-gradient(135deg, #2d1b69 0%, #1a0f3d 50%, #4a2d7c 100%);
      position: relative;
      overflow: hidden;
    }

    .space-background {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(2px 2px at 60% 70%, white, transparent),
        radial-gradient(1px 1px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 80% 10%, white, transparent),
        radial-gradient(2px 2px at 90% 60%, white, transparent),
        radial-gradient(1px 1px at 33% 80%, white, transparent),
        radial-gradient(1px 1px at 15% 15%, white, transparent);
      background-size: 200% 200%;
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .planet {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
    }

    .planet1 {
      width: 150px;
      height: 150px;
      background: radial-gradient(circle at 30% 30%, #6b94d4, #3d5a8f);
      top: 15%;
      right: 25%;
      opacity: 0.6;
    }

    .planet2 {
      width: 100px;
      height: 100px;
      background: radial-gradient(circle at 30% 30%, #9b6bb4, #5d3a7a);
      bottom: 30%;
      left: 15%;
      opacity: 0.5;
    }

    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(91, 78, 159, 0.3), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(40px);
    }

    .extreme-logo {
      position: absolute;
      bottom: 40px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: white;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #5b4e9f;
      font-size: 20px;
    }

    .logo-text-bottom {
      color: white;
      font-size: 18px;
      font-weight: 500;
    }

    .logo-text-bottom .networks {
      font-size: 12px;
      font-weight: 300;
      display: block;
      letter-spacing: 2px;
    }

    @media (max-width: 968px) {
      .container {
        flex-direction: column;
      }
      
      .right-panel {
        display: none;
      }
      
      .left-panel {
        padding: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <div class="logo-text">
        <h1>
          <span class="extreme">Extreme</span><span class="cloud">Cloud</span><sup>™</sup> <span class="iq">IQ</span> <span class="controller">Controllers</span>
        </h1>
      </div>

      <div class="login-form">
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="post" id="loginForm">
          <div class="form-group">
            <label>Username <span class="required">*</span></label>
            <input type="text" name="username" required>
          </div>

          <div class="form-group">
            <label>Password <span class="required">*</span></label>
            <input type="password" name="password" required>
          </div>

          <button type="submit" class="login-button">Login</button>
        </form>
      </div>

      <div class="footer">
        © 2025 Extreme Networks - All Rights Reserved.
      </div>
    </div>

    <div class="right-panel">
      <div class="space-background"></div>
      <div class="glow"></div>
      <div class="planet planet1"></div>
      <div class="planet planet2"></div>
      
      <div class="extreme-logo">
        <div class="logo-icon">E</div>
        <div class="logo-text-bottom">
          Extreme
          <span class="networks">NETWORKS</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const inputs = form.querySelectorAll('input');
    const button = form.querySelector('.login-button');

    function checkForm() {
      const allFilled = Array.from(inputs).every(input => input.value.trim() !== '');
      if (allFilled) {
        button.style.background = '#5b4e9f';
        button.style.color = 'white';
        button.style.cursor = 'pointer';
        button.disabled = false;
      } else {
        button.style.background = '#e8e8f0';
        button.style.color = '#999';
        button.style.cursor = 'not-allowed';
        button.disabled = true;
      }
    }

    inputs.forEach(input => {
      input.addEventListener('input', checkForm);
    });

    checkForm();
  </script>
</body>
</html>
